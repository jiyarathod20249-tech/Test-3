
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyNest</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>StudyNest 🌱</h1>
    <p>Your little space to learn and grow.</p>

    <form id="task-form">
      <input id="task-input" placeholder="What do you need to study?" required>
      <button type="submit">Add task</button>
    </form>

    <p id="progress">0 tasks completed</p>
    <ul id="task-list"></ul>
  </main>
</body>
</html>
